<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VocabCraft</title>
    <meta name="description" content="A block-world vocabulary adventure game for kids." />
    <meta property="og:title" content="VocabCraft" />
    <meta property="og:description" content="A block-world vocabulary adventure game for kids." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VocabCraft" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <style>
      /* Ensure 3D transforms work */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-preserve-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
      html,
      body {
        background: #e0f2fe;
      }
      .boot-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        color: #0369a1;
      }
      .boot-splash__icon {
        font-size: 48px;
        animation: boot-bob 1.2s ease-in-out infinite;
      }
      @keyframes boot-bob {
        50% {
          transform: translateY(-8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Lightweight boot screen: visible instantly while the game bundle downloads; React replaces it. -->
    <div id="root"><div class="boot-splash" role="status" aria-live="polite"><div class="boot-splash__icon">📚</div><p>Loading Wordtopia…</p></div></div>
    <noscript><p style="padding:24px;font-family:sans-serif;text-align:center">Wordtopia needs JavaScript turned on to play.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
