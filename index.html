<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Runtime Environment: HMR is disabled in this environment.
      // Suppress Vite HMR WebSocket connection failure messages so they don't trigger platform error overlays.
      (function() {
        const _origError = console.error;
        console.error = function(...args) {
          const str = args.map(a => (typeof a === 'string' ? a : (a && (a.message || a.stack)) || '')).join(' ');
          if (str.includes('[vite]') && (str.includes('websocket') || str.includes('WebSocket') || str.includes('connection') || str.includes('closed without opened'))) {
            return;
          }
          _origError.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          const msg = (event.message || '') + (event.filename || '');
          if (msg.includes('WebSocket') || msg.includes('[vite]') || msg.includes('vite-hmr')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          const reason = (event.reason && (event.reason.message || event.reason.stack || event.reason)) || '';
          if (String(reason).includes('WebSocket') || String(reason).includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>Wordtopia</title>
    <meta name="description" content="A block-world vocabulary adventure game for kids." />
    <meta property="og:title" content="Wordtopia" />
    <meta property="og:description" content="A block-world vocabulary adventure game for kids." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wordtopia" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />

    <style>
      /* Ensure 3D transforms work */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-preserve-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
